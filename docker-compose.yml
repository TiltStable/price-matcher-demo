services:
  db:
    image: postgres:16-alpine
    container_name: pricematcher-db
    environment:
      POSTGRES_USER: pricematcher
      POSTGRES_PASSWORD: pricematcher
      POSTGRES_DB: pricematcher
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricematcher -d pricematcher"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
