[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "price-matcher"
version = "0.1.0"
description = "Automated supplier price-list matching with best-price aggregation (HoReCa)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "SQLAlchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "rapidfuzz==3.11.0",
    "typer==0.15.1",
    "rich==13.9.4",
    "openai==1.59.6",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
price-matcher = "price_matcher.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
